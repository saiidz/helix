name: HELIX validation

on:
  push:
    branches: [main, feat/codex-inspired-ui-v02, feat/helix-useful-v03, feat/helix-lockdown-v03, feat/helix-product-v04]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helix-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Standard hosted runners for this public repo only; never opt into paid capacity.
    if: github.repository == 'saiidz/helix' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Startup and project regression tests
        timeout-minutes: 2
        run: python -m pytest -q tests/test_startup.py tests/test_projects.py tests/test_project_ranking.py
      - name: Full offline regression suite
        timeout-minutes: 4
        run: python -m pytest -vv -o faulthandler_timeout=45
      - name: Compile application, tools and tests
        run: python -m compileall -q helix tests tools
      - name: Check product JavaScript
        run: |
          node --check helix/static/app.js
          node --check helix/static/engineer_jobs.js
          node --check helix/static/admin.js
      - name: Offline routing and reasoning evaluation
        run: python -m tools.intelligence_eval
