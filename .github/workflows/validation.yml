name: HELIX validation

on:
  push:
    branches: [main, feat/codex-inspired-ui-v02, feat/helix-useful-v03, feat/helix-lockdown-v03, feat/helix-product-v04, feat/helix-follow-through-v01]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helix-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Standard hosted runners for this public repo only; never opt into paid capacity.
    if: github.repository == 'saiidz/helix' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Tracked source only: never archive the working directory, credentials or runtime data.
      - name: Archive exact follow-through source for reproducible review
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/feat/helix-follow-through-v01'
        run: git archive --format=zip --output=helix-source.zip HEAD
      - name: Upload source review snapshot
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/feat/helix-follow-through-v01'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helix-source-${{ github.sha }}
          path: helix-source.zip
          retention-days: 1
          if-no-files-found: error
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Startup and project regression tests
        timeout-minutes: 2
        run: python -m pytest -q tests/test_startup.py tests/test_projects.py tests/test_project_ranking.py
      - name: Full offline regression suite
        timeout-minutes: 4
        run: python -m pytest -vv -o faulthandler_timeout=45
      - name: Compile application, tools and tests
        run: python -m compileall -q helix tests tools
      - name: Check product JavaScript
        run: |
          node --check helix/static/app.js
          node --check helix/static/engineer_jobs.js
          node --check helix/static/admin.js
          node --check helix/static/follow_through.js
      - name: Offline routing and reasoning evaluation
        run: python -m tools.intelligence_eval
      - name: Install optional pinned browser test dependency
        if: matrix.os == 'ubuntu-latest'
        run: python -m pip install -r requirements-browser.txt
      - name: Follow-through real-browser smoke (synthetic data)
        if: matrix.os == 'ubuntu-latest'
        run: python -m tools.follow_through_smoke
      - name: Upload browser evidence
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helix-follow-through-browser-${{ github.sha }}
          path: .ci-artifacts/follow-through/
          retention-days: 7
          if-no-files-found: warn
